name: Build bt-snr1 sysupgrade image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout this repo (already contains the bt-snr1 DTS + device definition)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: openwrt-25.12
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget \
          curl jq time libelf-dev libncursesw5-dev autoconf automake libtool autopoint \
          texinfo patch pkg-config meson ninja-build device-tree-compiler

      - name: Configure Feeds (official clean feeds)
        run: |
          > feeds.conf.default
          echo "src-git packages https://github.com/immortalwrt/packages.git;openwrt-25.12" >> feeds.conf.default
          echo "src-git luci https://github.com/immortalwrt/luci.git;openwrt-25.12" >> feeds.conf.default
          echo "src-git routing https://github.com/openwrt/routing.git;openwrt-25.12" >> feeds.conf.default
          echo "src-git telephony https://github.com/openwrt/telephony.git;openwrt-25.12" >> feeds.conf.default

      - name: Update & install feeds
        run: |
          ./scripts/feeds clean
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate build config for bt-snr1 specifically
        run: |
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_bt-snr1=y" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          make defconfig

      - name: Verify the device was actually selected (fail fast if not)
        run: |
          if ! grep -q "^CONFIG_TARGET_mediatek_filogic_DEVICE_bt-snr1=y" .config; then
            echo "ERROR: bt-snr1 device was not recognized by this source tree. Aborting before wasting build time."
            exit 1
          fi
          echo "Confirmed: building specifically for bt-snr1"
          grep "CONFIG_TARGET_PROFILE" .config

      - name: Download dependencies
        run: |
          make -j$(nproc) download V=s
          find ./dl -size -1024c -exec rm -f {} \;

      - name: Pre-build disk cleanup
        run: |
          sudo rm -rf /tmp/* /var/tmp/* ~/.cache/* || true
          df -h /

      - name: Compile firmware
        run: |
          echo "Attempt 1: full parallel build"
          make -j$(nproc) V=s || {
            echo "Parallel build hit a dependency-ordering race (common on first full builds)."
            echo "Retrying single-threaded to let package build order settle - this is expected to work."
            make -j1 V=s
          }
          ls -lh bin/targets/mediatek/filogic/ | grep -i snr1

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: bt-snr1-immortalwrt-25.12-sysupgrade
          path: |
            bin/targets/mediatek/filogic/*bt-snr1*
            bin/targets/mediatek/filogic/*.manifest
          retention-days: 90
